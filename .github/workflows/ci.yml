name: Tests and packaging
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - name: Static-only authored demo
        run: python scripts/demo.py --output "${{ runner.temp }}/doctor-demo"
      - name: Read-only replay of genuine evidence
        run: python scripts/generate_live_demo.py --output "${{ runner.temp }}/doctor-evidence-replay"
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir "${{ runner.temp }}/doctor-wheels"
      - name: Fresh installed-wheel smoke test
        shell: bash
        run: |
          python -m venv "${{ runner.temp }}/doctor-install"
          "${{ runner.temp }}/doctor-install/bin/python" -m pip install "${{ runner.temp }}"/doctor-wheels/*.whl
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/doctor-install/bin/reprodoctor" --help
# No target repository commands, Docker execution, approval receipts or publishing secrets.
# The default suite/replays do not start Docker or run target fixtures.
