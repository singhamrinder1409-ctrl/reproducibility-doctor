[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reproducibility-doctor"
version = "0.1.0.dev0"
description = "Evidence-based inspection of documented Python project setup"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Amrinder Singh"}]
requires-python = ">=3.12"
dependencies = ["markdown-it-py>=4,<5", "packaging>=26.3,<27"]

[project.scripts]
reprodoctor = "reprodoctor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = ["examples/live-success-fixture", "examples/live-failure-stops-fixture"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
